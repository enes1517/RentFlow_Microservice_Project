global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['userservice:80']
    metrics_path: '/metrics'

  - job_name: 'property-service'
    static_configs:
      - targets: ['propertyservice:80']
    metrics_path: '/metrics'

  - job_name: 'lease-service'
    static_configs:
      - targets: ['leaseservice:80']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['paymentservice:80']
    metrics_path: '/metrics'

  - job_name: 'maintenance-service'
    static_configs:
      - targets: ['maintenanceservice:80']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notificationservice:80']
    metrics_path: '/metrics'

  - job_name: 'document-service'
    static_configs:
      - targets: ['documentservice:80']
    metrics_path: '/metrics'

  - job_name: 'report-service'
    static_configs:
      - targets: ['reportservice:80']
    metrics_path: '/metrics'

  - job_name: 'saga-orchestrator'
    static_configs:
      - targets: ['sagaorchestrator:80']
    metrics_path: '/metrics'
